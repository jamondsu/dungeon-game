<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <title>Dungeon Roguelike</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            touch-action: none;           /* a phone: thumbs on the game, not zooming or scrolling the page */
            -webkit-touch-callout: none;
        }
        /* a phone's covers (TouchControls.cover) */
        .cover {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: #05060a;
            color: #f6d58a;
            font: bold 26px Georgia, serif;
            text-align: center;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .cover[hidden], .cover small[hidden], #host[hidden] { display: none; }
        .cover small { margin-top: 14px; color: #9aa4b8; font: 15px Georgia, serif; }
        /* a phone's game: the part of the screen you can see, clear of the notch (an iPhone's 100vh, which is what Phaser asks for by default, runs under the browser's bars) */
        #host {
            position: fixed;
            top: env(safe-area-inset-top);
            right: env(safe-area-inset-right);
            bottom: env(safe-area-inset-bottom);
            left: env(safe-area-inset-left);
        }
    </style>
</head>
<body>
    <div id="host" hidden></div>
    <div id="cover" class="cover" hidden>TAP TO PLAY<small id="addhome" hidden>For full screen: tap Share, then Add to Home Screen</small></div>

    <!-- ═══════════════════════════════════════════════════════════════════════
         ENGINE — UIKit + ElementResist + Transitions, INLINED.

         These were three files, then one file, and both times a copy that missed
         them left index.html requesting a script that 404s: the global never
         defines, the first scene throws ReferenceError inside create(), and the
         canvas stays black with the cause buried in the console.

         Inlined here because index.html is the one file that reliably travels. It
         cannot be out of step with itself and there is nothing beside it to forget.

         ORDER, preserved: UIKit (palette + widgets, called during create) →
         ElementResist (damage table, used by CombatSystem.damageEnemy) →
         Transitions (reads UIKit.PALETTE when it RUNS, not when it loads).

         EDITING: the readable sources are still Uikit.js / ElementResist.js /
         Transitions.js in the outputs folder. Edit those and re-inline, or edit
         here directly. Do NOT also load Engine.js or the three separates — each
         defines the same consts and the second definition throws.
         ═══════════════════════════════════════════════════════════════════════ -->
        <script src="core/Uikit.js?v=7242da5e"></script>
    <script src="combat/ElementResist.js?v=75d77724"></script>
    <script src="combat/FieldKit.js?v=841a21f8"></script>

    <!-- Initialize game -->
    <script>
        // No dependency guard here any more: UIKit, ElementResist and Transitions are
        // inlined above, so there is no external file of mine that can go missing. The
        // remaining <script src> tags are the project's own long-standing modules.
        var game;   // (var: Achievements.js asks typeof game, and on a phone there's none till the cover's been tapped)
        const start = () => {
            const touch = TouchControls.device(), host = document.getElementById('host');
            host.hidden = !touch;
            const box = touch ? host.getBoundingClientRect() : { width: window.innerWidth, height: window.innerHeight };
            const RS = Settings.renderScale(box.width, box.height);   // a big window drawn at fewer pixels (a little closer; fewer on low graphics), stretched to fill it
            const config = {
                type: Phaser.AUTO,
                // drawn at the window's size when it loads and stretched to fill the window or the screen as either changes
                // (FIT: the same picture bigger, its shape kept; fullscreen from Settings, or the browser's own)
                scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: Math.round(box.width * RS), height: Math.round(box.height * RS),
                         ...(touch && { parent: host, fullscreenTarget: document.documentElement }) },   // (the whole page, covers and all: Phaser's own would hide them)
                scene: [BootScene, LevelSelectScene, ShopScene, EnchantScene, GardenScene, UnderwellScene, SkyScene, GameScene, TowerDefenseScene, MirrorTrial],
                pixelArt: true,
                backgroundColor: '#000000'
            };

            game = new Phaser.Game(config);
            Settings.fpsMeter(game);   // the frame counter in the corner (Settings > FPS)
        };
        if (TouchControls.device()) TouchControls.cover(start); else start();
        Cloud.init();   // your account, if you're signed in: your save kept online
    </script>
</body>

    <title>Dungeon Roguelike</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            touch-action: none;           /* a phone: thumbs on the game, not zooming or scrolling the page */
            -webkit-touch-callout: none;
        }
        /* a phone's covers (TouchControls.cover) */
        .cover {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: #05060a;
            color: #f6d58a;
            font: bold 26px Georgia, serif;
            text-align: center;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .cover[hidden], .cover small[hidden], #host[hidden] { display: none; }
        .cover small { margin-top: 14px; color: #9aa4b8; font: 15px Georgia, serif; }
        /* a phone's game: the part of the screen you can see, clear of the notch (an iPhone's 100vh, which is what Phaser asks for by default, runs under the browser's bars) */
        #host {
            position: fixed;
            top: env(safe-area-inset-top);
            right: env(safe-area-inset-right);
            bottom: env(safe-area-inset-bottom);
            left: env(safe-area-inset-left);
        }
    </style>
</head>

    <!-- Initialize game -->
    <script>
        var game;   // (var: Achievements.js asks typeof game, and on a phone there's none till the cover's been tapped)
        const start = () => {
            const touch = TouchControls.device(), host = document.getElementById('host');
            host.hidden = !touch;
            const box = touch ? host.getBoundingClientRect() : { width: window.innerWidth, height: window.innerHeight };
            const RS = Settings.renderScale(box.width, box.height);   // a big window drawn at fewer pixels (a little closer; fewer on low graphics), stretched to fill it
            const config = {
                type: Phaser.AUTO,
                // drawn at the window's size when it loads and stretched to fill the window or the screen as either changes
                // (FIT: the same picture bigger, its shape kept; fullscreen from Settings, or the browser's own)
                scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: Math.round(box.width * RS), height: Math.round(box.height * RS),
                         ...(touch && { parent: host, fullscreenTarget: document.documentElement }) },   // (the whole page, covers and all: Phaser's own would hide them)
                scene: [BootScene, LevelSelectScene, ShopScene, EnchantScene, GardenScene, UnderwellScene, SkyScene, GameScene, TowerDefenseScene, MirrorTrial],
                pixelArt: true,
                backgroundColor: '#000000'
            };

            game = new Phaser.Game(config);
            Settings.fpsMeter(game);   // the frame counter in the corner (Settings > FPS)
        };
        if (TouchControls.device()) TouchControls.cover(start); else start();
        Cloud.init();   // your account, if you're signed in: your save kept online
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Roguelike</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            touch-action: none;           /* a phone: thumbs on the game, not zooming or scrolling the page */
            -webkit-touch-callout: none;
        }
    </style>
</head>
<body>
    <!-- Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <!-- Supabase (your account: saves online, the leaderboards) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>

    <!-- the release's version tag for the art manifest (BootScene); the ?v= on each script is its own, set with it -->
    <script>window.BUILD = '334d9d58';</script>
    <!-- Load utility files first -->
    <script src="Utils.js?v=8783fa08"></script>
    <script src="Sound.js?v=49a4eb3c"></script>
    <script src="Settings.js?v=be662bf0"></script>
    <script src="Telemetry.js?v=80e180a9"></script>

    <script src="Bounties.js?v=3648c0ae"></script>

    <script src="Progress.js?v=82b735a1"></script>

    <!-- ═══════════════════════════════════════════════════════════════════════
         ENGINE — UIKit + ElementResist + Transitions, INLINED.

         These were three files, then one file, and both times a copy that missed
         them left index.html requesting a script that 404s: the global never
         defines, the first scene throws ReferenceError inside create(), and the
         canvas stays black with the cause buried in the console.

         Inlined here because index.html is the one file that reliably travels. It
         cannot be out of step with itself and there is nothing beside it to forget.

         ORDER, preserved: UIKit (palette + widgets, called during create) →
         ElementResist (damage table, used by CombatSystem.damageEnemy) →
         Transitions (reads UIKit.PALETTE when it RUNS, not when it loads).

         EDITING: the readable sources are still Uikit.js / ElementResist.js /
         Transitions.js in the outputs folder. Edit those and re-inline, or edit
         here directly. Do NOT also load Engine.js or the three separates — each
         defines the same consts and the second definition throws.
         ═══════════════════════════════════════════════════════════════════════ -->
        <script src="Uikit.js?v=393416d4"></script>
    <script src="ElementResist.js?v=75d77724"></script>
    <script src="FieldKit.js?v=d092f72c"></script>
    <script src="Transitions.js?v=ff1e53fb"></script>
    <script src="Menus.js?v=3cdf94e9"></script>
    <script src="Loot.js?v=6d3f571a"></script>

    <!-- Load modules (must come before GameScene.js) -->
    <script src="LevelLayouts.js?v=97bade01"></script>
    <script src="WorldGen.js?v=bb767a93"></script>
    <script src="TutorialManager.js?v=ab2938cb"></script>

    <script src="WeaponSystem.js?v=05529e8b"></script>

    <script src="HUD.js?v=0788f041"></script>

    <script src="Creatures.js?v=099e3d86"></script>

    <script src="Bosses.js?v=41f18f49"></script>
    <script src="Tower.js?v=75e6dcbe"></script>
    <script src="Pulse.js?v=490ea050"></script>

    <script src="Rimeguard.js?v=2b5fb81d"></script>
    <script src="Fractal.js?v=8833928a"></script>
    <script src="Glaive.js?v=6c31f57c"></script>
    <script src="Trident.js?v=d3f303a3"></script>
    <script src="Fork.js?v=24e86e3d"></script>
    <script src="Training.js?v=5fdb9cca"></script>
    <script src="RhythmTrial.js?v=cfad4417"></script>

    <script src="Sniper.js?v=684fc114"></script>

    <!-- Load scene files -->
    <script src="BootScene.js?v=e996ed4d"></script>
    <script src="LevelSelectScene.js?v=2c21964e"></script>
    <script src="ShopScene.js?v=466a13d7"></script>
    <script src="EnchantScene.js?v=c9bbfd87"></script>
    <script src="GardenScene.js?v=f5b15aaf"></script>
    <script src="LevelManager.js?v=8536353f"></script>
    <script src="TowerDefenseScene.js?v=b9d82fbe"></script>
    <script src="GameScene.js?v=555ee584"></script>

    <!-- Initialize game -->
    <script>
        // No dependency guard here any more: UIKit, ElementResist and Transitions are
        // inlined above, so there is no external file of mine that can go missing. The
        // remaining <script src> tags are the project's own long-standing modules.
        const RS = Settings.renderScale();   // a big window drawn at fewer pixels (a little closer; fewer on low graphics), stretched to fill it
        const config = {
            type: Phaser.AUTO,
            // drawn at the window's size when it loads and stretched to fill the window or the screen as either changes
            // (FIT: the same picture bigger, its shape kept; fullscreen from Settings, or the browser's own)
            scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: Math.round(window.innerWidth * RS), height: Math.round(window.innerHeight * RS) },
            scene: [BootScene, LevelSelectScene, ShopScene, EnchantScene, GardenScene, UnderwellScene, SkyScene, GameScene, TowerDefenseScene, MirrorTrial],
            pixelArt: true,
            backgroundColor: '#000000'
        };

        const game = new Phaser.Game(config);
        Settings.fpsMeter(game);   // the frame counter in the corner (Settings > FPS)
        Cloud.init();   // your account, if you're signed in: your save kept online
    </script>
</body>
</html>

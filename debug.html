<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
</head>
<body>
<script>
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    scene: {
        preload: function() {
            this.load.spritesheet('slime_red', 'assets/Slime_Red_32x32.png', {
                frameWidth: 32,
                frameHeight: 32
            });
        },
        create: function() {
            let y = 50;
            for (let i = 0; i < 36; i++) {
                const x = (i % 6) * 100 + 50;
                if (i % 6 === 0) y += 100;
                
                const sprite = this.add.sprite(x, y, 'slime_red', i);
                sprite.setScale(2);
                
                this.add.text(x, y + 40, i, { 
                    fontSize: '16px', 
                    color: '#ffffff' 
                }).setOrigin(0.5);
            }
        }
    }
};
new Phaser.Game(config);
</script>
</body>
</html>
